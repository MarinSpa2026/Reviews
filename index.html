<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Reseñas y Opiniones</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 750px; margin: 0 auto; }
    h1 { text-align: center; color: #0f172a; margin-bottom: 25px; }
    
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
    
    .kpi-container { display: flex; gap: 15px; margin-bottom: 20px; text-align: center; }
    .kpi-box { flex: 1; background: #f1f5f9; padding: 15px; border-radius: 8px; }
    .kpi-num { font-size: 1.8em; font-weight: bold; color: #0284c7; }

    label { display: block; font-weight: 600; margin-top: 12px; margin-bottom: 5px; }
    input, select, textarea, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    input[type="file"] { padding: 8px; background: #f8fafc; cursor: pointer; }
    button { background-color: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    button:hover { background-color: #0369a1; }

    /* Histórico y Fotografías */
    .review-item { border-bottom: 1px solid #e2e8f0; padding: 16px 0; }
    .review-item:last-child { border-bottom: none; }
    .review-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 6px; }
    .stars { color: #f59e0b; letter-spacing: 2px; }
    .review-date { font-size: 12px; color: #94a3b8; font-weight: normal; margin-left: 8px; }
    .review-text { color: #334155; font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
    
    /* Estilo de imagen con indicador de zoom al pasar el cursor */
    .review-photo { 
      width: 100%; 
      max-height: 300px; 
      object-fit: contain; 
      background-color: #000; 
      border-radius: 8px; 
      margin-top: 10px; 
      border: 1px solid #cbd5e1; 
      display: block;
      cursor: zoom-in;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .review-photo:hover { opacity: 0.9; transform: scale(1.01); }

    .loading { text-align: center; color: #64748b; font-style: italic; padding: 20px 0; }

    /* Modal de Zoom (Lightbox) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #ffffff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }
    .close-btn:hover { color: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGO DE LA EMPRESA -->
  <div style="text-align: center; margin-bottom: 15px;">
    <img src="image0.png" alt="Logo de mi empresa" style="max-width: 180px; height: auto;" onerror="this.style.display='none'">
  </div>

  <h1>Déjanos tu opinión</h1>

  <!-- 1. FORMULARIO DE RESEÑAS -->
  <div class="card">
    <h3>Escribe una reseña</h3>
    <form id="reviewForm">
      <label for="nombre">Tu Nombre:</label>
      <input type="text" id="nombre" required placeholder="Ej. Carlos Mendoza">

      <label for="puntuacion">Calificación:</label>
      <select id="puntuacion">
        <option value="5">⭐⭐⭐⭐⭐ (5/5 Excelente)</option>
        <option value="4">⭐⭐⭐⭐ (4/5 Muy bueno)</option>
        <option value="3">⭐⭐⭐ (3/5 Regular)</option>
        <option value="2">⭐⭐ (2/5 Malo)</option>
        <option value="1">⭐ (1/5 Pésimo)</option>
      </select>

      <label for="comentario">Tu Opinión:</label>
      <textarea id="comentario" rows="3" required placeholder="Describe tu experiencia..."></textarea>

      <!-- Campo para foto -->
      <label for="foto">Adjuntar foto del trabajo o servicio (Opcional):</label>
      <input type="file" id="foto" accept="image/*">

      <button type="submit" id="btnEnviar">Publicar Reseña</button>
    </form>
  </div>

  <!-- 2. RESUMEN DE SATISFACCIÓN Y GRÁFICO -->
  <div class="card">
    <h3>Satisfacción General</h3>
    <div class="kpi-container">
      <div class="kpi-box">
        <div>Promedio</div>
        <div class="kpi-num" id="avgRating">0.0</div>
      </div>
      <div class="kpi-box">
        <div>Total Opiniones</div>
        <div class="kpi-num" id="totalReviews">0</div>
      </div>
    </div>
    <canvas id="satisfactionChart" height="120"></canvas>
  </div>

  <!-- 3. LISTA DE RESEÑAS PUBLICADAS -->
  <div class="card">
    <h3>Histórico de Reseñas</h3>
    <div id="reviewsList" class="loading">Cargando comentarios registrados...</div>
  </div>
</div>

<!-- Ventana Modal para ampliar la imagen -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="modalImg" onclick="event.stopPropagation()">
</div>

<script>
  // ⚠️ ASEGÚRATE DE MANTENER TU URL CORRECTA TERMINADA EN /exec:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPkUXeYKZusqyyPFpynqIkmRd2bdgHbvfxGOPDURJMi8OmeEESp8vdH0O8isa2-AP4/exec";

  let myChart;

  // Funciones para la ventana Modal de Zoom
  function openModal(imageSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modal.style.display = 'flex';
    modalImg.src = imageSrc;
  }

  function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
  }

  // Cerrar modal al presionar la tecla Esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Inicialización del gráfico con Chart.js
  function initChart(counts) {
    const ctx = document.getElementById('satisfactionChart').getContext('2d');
    if (myChart) myChart.destroy();
    
    myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['1★', '2★', '3★', '4★', '5★'],
        datasets: [{
          label: 'Cantidad de reseñas',
          data: counts,
          backgroundColor: ['#ef4444', '#f97316', '#eab308', '#06b6d4', '#10b981']
        }]
      },
      options: { 
        responsive: true, 
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, precision: 0 } } 
      }
    });
  }

  // Redimensiona y comprime la imagen a Base64
  function uploadImage(file, maxWidth = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
      if (file.size > 10 * 1024 * 1024) {
        reject(new Error("La imagen es demasiado grande. Selecciona una menor a 10 MB."));
        return;
      }

      const reader = new FileReader();
      reader.readAsDataURL(file);

      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;

        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedBase64);
        };

        img.onerror = (error) => reject(error);
      };

      reader.onerror = (error) => reject(error);
    });
  }

  // Cargar las reseñas almacenadas en Google Sheets
  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      
      let counts = [0, 0, 0, 0, 0];
      let total = data.length;
      let sum = 0;
      let listHtml = '';

      data.reverse().forEach(item => {
        let p = parseInt(item.puntuacion);
        if (p >= 1 && p <= 5) counts[p - 1]++;
        sum += p;

        let photoHtml = item.foto 
          ? `<img src="${escapeHtml(item.foto)}" class="review-photo" alt="Foto de la reseña" onclick="openModal('${escapeHtml(item.foto)}')">` 
          : '';

        listHtml += `
          <div class="review-item">
            <div class="review-header">
              <span>${escapeHtml(item.nombre)} <span class="review-date">${item.fecha || ''}</span></span>
              <span class="stars">${'★'.repeat(p)}${'☆'.repeat(5 - p)}</span>
            </div>
            <div class="review-text">${escapeHtml(item.comentario)}</div>
            ${photoHtml}
          </div>`;
      });

      document.getElementById('totalReviews').innerText = total;
      document.getElementById('avgRating').innerText = total > 0 ? (sum / total).toFixed(1) : "0.0";
      document.getElementById('reviewsList').innerHTML = listHtml || '<p>Aún no hay reseñas registradas. ¡Sé el primero!</p>';

      initChart(counts);
    } catch (e) {
      document.getElementById('reviewsList').innerText = 'No se pudieron cargar las reseñas.';
    }
  }

  // Manejador para enviar el formulario
  document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.innerText = 'Procesando y publicando...';

    const fileInput = document.getElementById('foto');
    let photoUrl = '';

    try {
      if (fileInput.files.length > 0) {
        photoUrl = await uploadImage(fileInput.files[0]);
      }

      const payload = {
        nombre: document.getElementById('nombre').value,
        puntuacion: document.getElementById('puntuacion').value,
        comentario: document.getElementById('comentario').value,
        foto: photoUrl
      };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      document.getElementById('reviewForm').reset();
      
      setTimeout(async () => {
        await loadData();
      }, 2000);

    } catch (error) {
      console.error(error);
      alert('Error al procesar o enviar la reseña.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Publicar Reseña';
    }
  });

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Carga inicial
  loadData();
</script>

</body>
</html>
