<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déjanos tu Reseña</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; color: #333; }
    label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

<div class="container">
  <h2>Déjanos tu opinión</h2>
  
  <form action="https://formspree.io/f/mrpgawbv" method="POST">
    
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">

    <label for="puntuacion">Puntuación:</label>
    <select id="puntuacion" name="puntuacion">
      <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
      <option value="4">⭐⭐⭐⭐ (4/5)</option>
      <option value="3">⭐⭐⭐ (3/5)</option>
      <option value="2">⭐⭐ (2/5)</option>
      <option value="1">⭐ (1/5)</option>
    </select>

    <label for="mensaje">Reseña:</label>
    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe aquí tu experiencia..."></textarea>

    <button type="submit">Enviar Reseña</button>
  </form>
</div>

</body>
</html>
